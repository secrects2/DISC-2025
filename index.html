<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DISC 人格特質測驗</title>
    <meta name="description" content="DISC 人格特質測驗 — 發現你獨特的行為風格">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .quiz-header {
            background: #fff;
            border-bottom: 1px solid #ecf0f1;
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .quiz-brand {
            font-weight: 700;
            color: var(--accent);
            font-size: 1.05rem;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.75;
        }

        .q-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 3px 14px;
            border-radius: 20px;
        }

        .result-hero {
            text-align: center;
            padding: 2.5rem 1.5rem;
            border-radius: 20px;
            background: linear-gradient(135deg, #f8f9fc, #eef1f8);
        }

        .result-hero .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .result-hero .type-name {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .result-hero .slogan {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-top: 4px;
        }

        .chart-wrapper {
            position: relative;
            max-width: 360px;
            margin: 0 auto;
        }

        .d-hidden {
            display: none !important;
        }

        /* 填寫資訊表單 */
        .info-form {
            max-width: 460px;
            margin: 0 auto;
        }

        .info-form .form-floating {
            margin-bottom: 12px;
        }

        @media(max-width:576px) {
            .question-title {
                font-size: 1.05rem;
            }

            .result-hero .type-name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <header class="quiz-header">
        <div class="container d-flex align-items-center justify-content-between">
            <span class="quiz-brand"><i class="bi bi-diamond-fill me-1"></i>DISC 測驗</span>
            <div class="d-flex align-items-center gap-2">
                <small class="text-muted" id="topInfo"></small>
                <button class="btn btn-sm btn-outline-secondary d-none" id="btnLogout"><i
                        class="bi bi-box-arrow-right"></i></button>
            </div>
        </div>
    </header>

    <main class="container py-4" style="max-width:680px">

        <!-- ===== 1) 資訊填寫區 ===== -->
        <div id="infoSection">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h4 class="fw-bold mb-2">🧬 DISC 人格特質測驗</h4>
                    <p class="text-muted mb-0">請先填寫基本資訊，再開始測驗</p>
                </div>
            </div>
            <div class="card">
                <div class="card-body info-form">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="inpName" placeholder="姓名" required>
                        <label>姓名 <span class="text-danger">*</span></label>
                    </div>
                    <div class="form-floating">
                        <input type="tel" class="form-control" id="inpPhone" placeholder="電話">
                        <label>電話</label>
                    </div>
                    <div class="form-floating">
                        <input type="email" class="form-control" id="inpEmail" placeholder="Email">
                        <label>Email</label>
                    </div>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="inpOrg" placeholder="組織/公司">
                        <label>組織 / 公司</label>
                    </div>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="inpDept" placeholder="部門">
                        <label>部門</label>
                    </div>
                    <button class="btn btn-primary w-100 mt-2 fw-semibold py-2" id="btnStartQuiz">開始測驗 →</button>
                    <div id="infoError" class="text-danger text-center mt-2" style="font-size:0.85rem"></div>
                </div>
            </div>
        </div>

        <!-- ===== 2) 測驗區 ===== -->
        <div id="quizSection" class="d-hidden">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <small class="text-muted">題目 <strong class="text-dark" id="qCur">1</strong> / <span
                        id="qTot">20</span></small>
                <small class="text-muted" id="qPct">0%</small>
            </div>
            <div class="progress mb-4">
                <div class="progress-bar" id="progFill" style="width:0%"></div>
            </div>
            <div class="card mb-3" id="qCard">
                <div class="card-body">
                    <span class="q-badge mb-3" id="qNum">第 1 題</span>
                    <div class="question-title mt-2" id="qText">載入中...</div>
                </div>
            </div>
            <div class="row g-3" id="optArea"></div>
        </div>

        <!-- ===== 3) 結果區 ===== -->
        <div id="resultSection" class="d-hidden">
            <div class="card mb-4">
                <div class="card-body result-hero">
                    <span class="icon" id="rIcon">🐵</span>
                    <div class="type-name" id="rType">支配型</div>
                    <div class="slogan" id="rSlogan">一句話描述</div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h6 class="fw-bold mb-3"><i class="bi bi-bar-chart-fill me-1 text-muted"></i>得分分佈</h6>
                    <div id="barArea">
                        <div class="disc-bar">
                            <div class="disc-bar-label" style="color:var(--d-color)">D</div>
                            <div class="disc-bar-track">
                                <div class="disc-bar-fill" id="barD" style="background:var(--d-color);width:0%"></div>
                            </div>
                            <div class="disc-bar-val" id="valD">0</div>
                        </div>
                        <div class="disc-bar">
                            <div class="disc-bar-label" style="color:var(--i-color)">I</div>
                            <div class="disc-bar-track">
                                <div class="disc-bar-fill" id="barI" style="background:var(--i-color);width:0%"></div>
                            </div>
                            <div class="disc-bar-val" id="valI">0</div>
                        </div>
                        <div class="disc-bar">
                            <div class="disc-bar-label" style="color:var(--s-color)">S</div>
                            <div class="disc-bar-track">
                                <div class="disc-bar-fill" id="barS" style="background:var(--s-color);width:0%"></div>
                            </div>
                            <div class="disc-bar-val" id="valS">0</div>
                        </div>
                        <div class="disc-bar">
                            <div class="disc-bar-label" style="color:var(--c-color)">C</div>
                            <div class="disc-bar-track">
                                <div class="disc-bar-fill" id="barC" style="background:var(--c-color);width:0%"></div>
                            </div>
                            <div class="disc-bar-val" id="valC">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h6 class="fw-bold mb-3"><i class="bi bi-diagram-3-fill me-1 text-muted"></i>人格雷達圖</h6>
                    <div class="chart-wrapper"><canvas id="radarChart"></canvas></div>
                </div>
            </div>

            <div id="analysisArea"></div>

            <div class="d-flex gap-2 justify-content-center mt-4 mb-5">
                <button class="btn btn-primary px-4" id="btnRestart"><i
                        class="bi bi-arrow-repeat me-1"></i>重新測驗</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script type="module">
        import { db, collection, addDoc, getRefCode } from './firebase-config.js';
        /* ===== 推薦碼 ===== */
        const refCode = getRefCode();

        /* ===== 使用者資訊（如果透過登入進來） ===== */
        const user = JSON.parse(sessionStorage.getItem('user') || 'null');
        if (user) {
            document.getElementById('topInfo').textContent = user.name || user.username;
            document.getElementById('btnLogout').classList.remove('d-none');
            document.getElementById('btnLogout').onclick = () => {
                sessionStorage.removeItem('user');
                window.location.href = 'login.html';
            };
            // 自動填寫資訊
            if (user.name) document.getElementById('inpName').value = user.name;
            if (user.dept) document.getElementById('inpDept').value = user.dept;
        }

        /* ===== 資訊收集 ===== */
        let takerInfo = {};
        document.getElementById('btnStartQuiz').onclick = () => {
            const name = document.getElementById('inpName').value.trim();
            if (!name) {
                document.getElementById('infoError').textContent = '請填寫姓名';
                return;
            }
            takerInfo = {
                taker_name: name,
                taker_phone: document.getElementById('inpPhone').value.trim(),
                taker_email: document.getElementById('inpEmail').value.trim(),
                org: document.getElementById('inpOrg').value.trim(),
                dept: document.getElementById('inpDept').value.trim(),
                title: ''
            };
            document.getElementById('infoSection').classList.add('d-hidden');
            document.getElementById('quizSection').classList.remove('d-hidden');
            loadQuestion();
        };

        /* ===== 題庫 ===== */

            { text: "當你與人發生衝突或意見不合時，你會...", options: [{ text: "據理力爭，堅持自己的觀點", type: "D" }, { text: "試著用幽默化解尷尬，或找人說和", type: "I" }, { text: "為了氣氛和諧，可能會選擇退讓", type: "S" }, { text: "列舉證據和資料，證明我是對的", type: "C" }] },
            { text: "在社交場合中，你通常是...", options: [{ text: "主導話題，掌控聚會節奏的人", type: "D" }, { text: "全場焦點，負責炒熱氣氛的人", type: "I" }, { text: "安靜的傾聽者，微笑附和的人", type: "S" }, { text: "在一旁觀察，與少數人深度交談的人", type: "C" }] },
            { text: "購買高單價商品（如手機、家電）時，你的習慣是...", options: [{ text: "看準目標，付錢走人，講求效率", type: "D" }, { text: "看外型、看流行，朋友推薦就買", type: "I" }, { text: "習慣買用過的品牌，不想冒險", type: "S" }, { text: "詳細比較規格、保固、價格後才買", type: "C" }] },

                cards: [{ icon: "🌟", title: "人格特質", text: "你就像豬八戒，是團隊的開心果。樂觀熱情，口才好，擅長人際交往，總能用幽默化解尷尬。" }, { icon: "💪", title: "優勢天賦", text: "善於溝通、有創意、適應力強、充滿活力，能激勵團隊士氣，是天生的公關高手。" }, { icon: "⚠️", title: "潛在盲點", text: "注意力不集中、做事三分鐘熱度、容易情緒化、對細節比較大而化之。" }, { icon: "💡", title: "發展建議", text: "學習唐三藏的專注，試著把事情堅持到底。確保承諾能夠兌現，你會更受人信賴。" }]

            C: {
                title: "分析型 — 唐三藏", slogan: "「悟空，切莫殺生。」追求完美的取經人", icon: "🧘", color: "#2980b9",
                cards: [{ icon: "🌟", title: "人格特質", text: "你就像唐三藏，做事有原則、講究SOP。追求完美，重視邏輯與資料，做決定前會深思熟慮。" }, { icon: "💪", title: "優勢天賦", text: "邏輯縝密、注重細節、品質把關嚴格、善於分析風險與制定計劃。" }, { icon: "⚠️", title: "潛在盲點", text: "過於挑剔、容易鑽牛角尖、標準太高讓人有壓力、反應較慢。" }, { icon: "💡", title: "發展建議", text: "這個世界並不完美，學習接受「小瑕疵」。放鬆標準，多一點隨性，日子會更快樂。" }]
            }
        };

        /* ===== 測驗邏輯 ===== */
        let curQ = 0, scores = { D: 0, I: 0, S: 0, C: 0 };
        const total = questions.length;
        document.getElementById('qTot').textContent = total;

        function loadQuestion() {
            const q = questions[curQ];
            document.getElementById('qCur').textContent = curQ + 1;
            document.getElementById('qNum').textContent = `第 ${curQ + 1} 題`;
            document.getElementById('qText').textContent = q.text;
            const pct = Math.round((curQ / total) * 100);
            document.getElementById('qPct').textContent = pct + '%';
            document.getElementById('progFill').style.width = pct + '%';

            const area = document.getElementById('optArea');
            area.innerHTML = '';
            [...q.options].sort(() => Math.random() - 0.5).forEach((o, i) => {
                const col = document.createElement('div');
                col.className = 'col-12 col-sm-6 fade-in-up';
                col.style.animationDelay = (i * 0.06) + 's';
                const btn = document.createElement('button');
                btn.className = 'option-card';
                btn.textContent = o.text;
                btn.onclick = () => { scores[o.type]++; curQ++; curQ < total ? loadQuestion() : finishQuiz(); };
                col.appendChild(btn);
                area.appendChild(col);
            });
        }

        function finishQuiz() {
            document.getElementById('progFill').style.width = '100%';
            document.getElementById('qPct').textContent = '100%';
            showResult();
        }

        /* ===== 結果 ===== */
        async function showResult() {
            document.getElementById('quizSection').classList.add('d-hidden');
            document.getElementById('resultSection').classList.remove('d-hidden');

            let maxS = -1, maxT = 'D';
            for (const [t, s] of Object.entries(scores)) { if (s > maxS) { maxS = s; maxT = t; } }
            const r = resultsData[maxT];

            document.getElementById('rIcon').textContent = r.icon;
            const typeEl = document.getElementById('rType');
            typeEl.textContent = r.title; typeEl.style.color = r.color;
            document.getElementById('rSlogan').textContent = r.slogan;

            setTimeout(() => {
                ['D', 'I', 'S', 'C'].forEach(t => {
                    const pct = (scores[t] / total) * 100;
                    document.getElementById('bar' + t).style.width = pct + '%';
                    document.getElementById('val' + t).textContent = scores[t];
                });
            }, 300);

            // 雷達圖
            new Chart(document.getElementById('radarChart').getContext('2d'), {
                type: 'radar',
                data: {
                    labels: ['D 支配', 'I 影響', 'S 穩健', 'C 分析'],
                    datasets: [{
                        label: '得分', data: [scores.D, scores.I, scores.S, scores.C],
                        backgroundColor: 'rgba(108,92,231,0.15)', borderColor: '#6c5ce7', borderWidth: 2,
                        pointBackgroundColor: ['#e74c3c', '#f39c12', '#27ae60', '#2980b9'], pointBorderColor: '#fff', pointBorderWidth: 2, pointRadius: 6
                    }]
                },
                options: {
                    responsive: true, scales: {
                        r: {
                            beginAtZero: true, max: Math.max(total * 0.6, maxS + 2),
                            ticks: { stepSize: 2, backdropColor: 'transparent' }, grid: { color: 'rgba(0,0,0,0.06)' }, angleLines: { color: 'rgba(0,0,0,0.06)' },
                            pointLabels: { font: { size: 13, weight: '600' } }
                        }
                    }, plugins: { legend: { display: false } }
                }
            });

            // 分析卡片
            const area = document.getElementById('analysisArea');
            area.innerHTML = '';
            r.cards.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = 'card analysis-card fade-in-up';
                div.style.borderLeftColor = r.color;
                div.style.animationDelay = (0.2 + i * 0.1) + 's'; div.style.opacity = '0';
                div.innerHTML = `<div class="card-body"><h6 style="color:${r.color}">${c.icon} ${c.title}</h6><p>${c.text}</p></div>`;
                area.appendChild(div);
            });

            // 儲存到 Supabase
            const pctScores = {
                d_score: Math.round((scores.D / total) * 100), i_score: Math.round((scores.I / total) * 100),
                s_score: Math.round((scores.S / total) * 100), c_score: Math.round((scores.C / total) * 100)
            };
            try {
                await addDoc(collection(db, 'records'), {
                    ...takerInfo,
                    ...pctScores,
                    primary_type: maxT,
                    referral_code: refCode,
                    raw_scores: scores,
                    created_at: new Date().toISOString()
                });
            } catch (e) { console.error('儲存失敗', e); }
        }

        /* ===== 重做 ===== */
        document.getElementById('btnRestart').onclick = () => {
            curQ = 0; scores = { D: 0, I: 0, S: 0, C: 0 };
            document.getElementById('resultSection').classList.add('d-hidden');
            document.getElementById('quizSection').classList.remove('d-hidden');
            loadQuestion();
        };
    </script>
</body>

</html>
