<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DISC 網紅面板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .inf-header {
            background: #fff;
            border-bottom: 1px solid #ecf0f1;
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .link-box {
            background: var(--bg-main);
            border: 1.5px dashed #bdc3c7;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.2s
        }

        .link-box:hover {
            border-color: var(--accent)
        }

        .link-url {
            flex: 1;
            font-family: monospace;
            font-size: 0.88rem;
            color: var(--accent);
            word-break: break-all
        }

        .stat-card {
            text-align: center;
            padding: 1.2rem
        }

        .stat-card .num {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px
        }

        .section-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .mini-chart {
            width: 80px;
            height: 60px
        }

        .table-responsive {
            max-height: 500px;
            overflow-y: auto
        }
    </style>
</head>

<body>
    <header class="inf-header">
        <div class="container d-flex align-items-center justify-content-between">
            <span style="font-weight:700;color:var(--accent);font-size:1.05rem"><i class="bi bi-star-fill me-1"></i>DISC
                網紅面板</span>
            <div class="d-flex align-items-center gap-2">
                <small class="text-muted" id="infName"></small>
                <button class="btn btn-sm btn-outline-secondary" id="btnLogout"><i
                        class="bi bi-box-arrow-right me-1"></i>登出</button>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <!-- 專屬連結 -->
        <div class="card mb-4">
            <div class="card-body">
                <h6 class="section-title mb-3"><i class="bi bi-link-45deg text-muted"></i>我的專屬推薦連結</h6>
                <div class="link-box" id="linkBox" title="點選複製">
                    <span class="link-url" id="myLink">—</span>
                    <button class="btn btn-sm btn-primary" id="btnCopy"><i class="bi bi-clipboard me-1"></i>複製</button>
                </div>
                <small class="text-muted mt-2 d-block">將此連結分享給消費者，他們的測驗結果會自動關聯到你的帳號。</small>
            </div>
        </div>

        <!-- 統計 -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num text-primary" id="statTotal">--</div>
                    <div class="label">總測驗次數</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num" style="color:var(--d-color)" id="statD">--</div>
                    <div class="label">D 型</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num" style="color:var(--i-color)" id="statI">--</div>
                    <div class="label">I 型</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num" style="color:var(--s-color)" id="statS">--</div>
                    <div class="label">S 型</div>
                </div>
            </div>
        </div>

        <!-- 分佈圖 -->
        <div class="card mb-4">
            <div class="card-body">
                <h6 class="section-title"><i class="bi bi-pie-chart-fill text-muted"></i>我的受眾 DISC 分佈</h6>
                <div style="max-width:360px;margin:0 auto"><canvas id="pieChart"></canvas></div>
            </div>
        </div>

        <!-- 記錄表 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h6 class="section-title mb-0"><i class="bi bi-table text-muted"></i>測驗記錄</h6>
                    <button class="btn btn-sm btn-outline-secondary" id="btnExport"><i
                            class="bi bi-download me-1"></i>CSV</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="tbl">
                        <thead>
                            <tr></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-transparent border-0 py-2 px-3"><small class="text-muted" id="meta"></small>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script type="module">
        import {
            db, collection, getDocs,
            query, where, orderBy
        } from './firebase-config.js';
        /* ===== 許可權 ===== */
        const user = JSON.parse(sessionStorage.getItem('user') || 'null');
        if (!user || user.role !== 'influencer') { alert('需要網紅帳號登入'); window.location.href = 'login.html'; }
        document.getElementById('infName').textContent = user.name || user.username;
        document.getElementById('btnLogout').onclick = () => { sessionStorage.removeItem('user'); window.location.href = 'login.html'; };

        /* ===== 專屬連結 ===== */
        const baseUrl = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
        const myLink = `${baseUrl}index.html?ref=${user.referral_code || ''}`;
        document.getElementById('myLink').textContent = myLink;

        document.getElementById('btnCopy').onclick = () => {
            navigator.clipboard.writeText(myLink).then(() => {
                const btn = document.getElementById('btnCopy');
                btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>已複製';
                btn.classList.replace('btn-primary', 'btn-success');
                setTimeout(() => { btn.innerHTML = '<i class="bi bi-clipboard me-1"></i>複製'; btn.classList.replace('btn-success', 'btn-primary'); }, 2000);
            });
        };

        /* ===== 載入資料 ===== */
        async function loadData() {
            try {
                const q = query(
                    collection(db, 'records'),
                    where('referral_code', '==', user.referral_code || '__none__'),
                    orderBy('created_at', 'desc')
                );
                const snapshot = await getDocs(q);
                const rows = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(rows);
                updateStats(rows);
            } catch (error) {
                alert('載入失敗');
            }
        }

        function renderTable(rows) {
            const thead = document.querySelector('#tbl thead tr');
            const tbody = document.querySelector('#tbl tbody');
            thead.innerHTML = ''; tbody.innerHTML = '';
            if (!rows.length) { thead.innerHTML = '<th class="text-center text-muted">暫無資料，分享你的連結開始收集！</th>'; document.getElementById('meta').textContent = ''; return; }

            thead.innerHTML = '<th>時間</th><th>姓名</th><th>電話</th><th>Email</th><th>D</th><th>I</th><th>S</th><th>C</th><th>主型</th><th>圖表</th>';
            const colors = { D: 'var(--d-color)', I: 'var(--i-color)', S: 'var(--s-color)', C: 'var(--c-color)' };
            rows.forEach(r => {
                const d = new Date(r.created_at);
                const tr = document.createElement('tr');
                tr.innerHTML = `
      <td class="text-nowrap">${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}</td>
      <td>${r.taker_name || ''}</td><td>${r.taker_phone || ''}</td><td>${r.taker_email || ''}</td>
      <td><strong style="color:${colors.D}">${r.d_score}</strong></td>
      <td><strong style="color:${colors.I}">${r.i_score}</strong></td>
      <td><strong style="color:${colors.S}">${r.s_score}</strong></td>
      <td><strong style="color:${colors.C}">${r.c_score}</strong></td>
      <td><span class="badge" style="background:${colors[r.primary_type] || '#999'};color:#fff">${r.primary_type || '?'}</span></td>
      <td></td>`;
                const canvas = document.createElement('canvas'); canvas.className = 'mini-chart';
                tr.lastElementChild.appendChild(canvas);
                tbody.appendChild(tr);
                new Chart(canvas.getContext('2d'), { type: 'bar', data: { labels: ['D', 'I', 'S', 'C'], datasets: [{ data: [r.d_score, r.i_score, r.s_score, r.c_score], backgroundColor: ['#e74c3c', '#f39c12', '#27ae60', '#2980b9'], borderRadius: 3 }] }, options: { responsive: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } } } });
            });
            document.getElementById('meta').textContent = `共 ${rows.length} 筆`;
        }

        function updateStats(rows) {
            document.getElementById('statTotal').textContent = rows.length;
            let d = 0, i = 0, s = 0, c = 0;
            rows.forEach(r => { if (r.primary_type === 'D') d++; else if (r.primary_type === 'I') i++; else if (r.primary_type === 'S') s++; else c++; });
            document.getElementById('statD').textContent = d;
            document.getElementById('statI').textContent = i;
            document.getElementById('statS').textContent = s;
            renderPie([d, i, s, c]);
        }

        let pieInst = null;
        function renderPie(data) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if (pieInst) pieInst.destroy();
            pieInst = new Chart(ctx, { type: 'doughnut', data: { labels: ['D 支配型', 'I 影響型', 'S 穩健型', 'C 分析型'], datasets: [{ data, backgroundColor: ['#e74c3c', '#f39c12', '#27ae60', '#2980b9'], borderWidth: 3, borderColor: '#fff' }] }, options: { responsive: true, cutout: '55%', plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, font: { size: 12 } } } } } });
        }

        /* ===== CSV ===== */
        document.getElementById('btnExport').onclick = () => {
            const rows = [...document.querySelectorAll('#tbl tr')].map(tr => [...tr.children].map(td => `"${String(td.textContent).replace(/"/g, '""')}"`).join(','));
            const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `disc_my_records_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
        };

        loadData();
    </script>
</body>

</html>
