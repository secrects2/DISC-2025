<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DISC 管理後臺</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-header {
            background: #fff;
            border-bottom: 1px solid #ecf0f1;
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .stat-card {
            text-align: center;
            padding: 1.2rem
        }

        .stat-card .num {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px
        }

        .mini-chart {
            width: 80px;
            height: 60px
        }

        .section-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .table-responsive {
            max-height: 500px;
            overflow-y: auto
        }

        .user-pw-input {
            width: 120px
        }

        @media(max-width:576px) {
            .stat-card .num {
                font-size: 1.5rem
            }

            .mini-chart {
                width: 60px;
                height: 45px
            }

            .user-pw-input {
                width: 90px
            }
        }
    </style>
</head>

<body>
    <header class="admin-header">
        <div class="container d-flex align-items-center justify-content-between">
            <span style="font-weight:700;color:var(--accent);font-size:1.05rem"><i
                    class="bi bi-shield-check me-1"></i>DISC 管理後臺</span>
            <div class="d-flex align-items-center gap-2">
                <small class="text-muted d-none d-sm-inline" id="adminName"></small>
                <button class="btn btn-sm btn-outline-secondary" id="btnLogout"><i
                        class="bi bi-box-arrow-right me-1"></i>登出</button>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <!-- 統計 -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num text-primary" id="statTotal">--</div>
                    <div class="label">總測驗次數</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num" style="color:var(--d-color)" id="statD">--</div>
                    <div class="label">D 型人數</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num" style="color:var(--i-color)" id="statI">--</div>
                    <div class="label">I 型人數</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card">
                    <div class="num" style="color:var(--s-color)" id="statS">--</div>
                    <div class="label">S 型人數</div>
                </div>
            </div>
        </div>

        <!-- 分佈圖 -->
        <div class="card mb-4">
            <div class="card-body">
                <h6 class="section-title"><i class="bi bi-pie-chart-fill text-muted"></i>DISC 型別分佈</h6>
                <div style="max-width:360px;margin:0 auto"><canvas id="pieChart"></canvas></div>
            </div>
        </div>

        <!-- 查詢 -->
        <div class="card mb-4">
            <div class="card-body">
                <h6 class="section-title mb-3"><i class="bi bi-search text-muted"></i>測驗記錄查詢</h6>
                <div class="row g-2 mb-3">
                    <div class="col-6 col-md-3"><input class="form-control form-control-sm" id="fName" placeholder="姓名">
                    </div>
                    <div class="col-6 col-md-3"><input class="form-control form-control-sm" id="fRef" placeholder="推薦碼">
                    </div>
                    <div class="col-6 col-md-3"><input class="form-control form-control-sm" id="fFrom" type="date">
                    </div>
                    <div class="col-6 col-md-3"><input class="form-control form-control-sm" id="fTo" type="date"></div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary btn-sm" id="btnSearch"><i class="bi bi-search me-1"></i>查詢</button>
                    <button class="btn btn-outline-secondary btn-sm" id="btnExport"><i
                            class="bi bi-download me-1"></i>匯出 CSV</button>
                </div>
            </div>
        </div>

        <!-- 結果表 -->
        <div class="card mb-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="tbl">
                        <thead>
                            <tr></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-transparent border-0 py-2 px-3"><small class="text-muted" id="meta"></small>
            </div>
        </div>

        <!-- 使用者管理 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h6 class="section-title mb-0"><i class="bi bi-people-fill text-muted"></i>使用者帳號管理</h6>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-primary" id="btnAddUser"><i
                                class="bi bi-plus-lg me-1"></i>新增</button>
                        <button class="btn btn-sm btn-outline-secondary" id="btnLoadUsers"><i
                                class="bi bi-arrow-clockwise"></i></button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="tblUsers">
                        <thead>
                            <tr>
                                <th>帳號</th>
                                <th>姓名</th>
                                <th>角色</th>
                                <th>推薦碼</th>
                                <th>狀態</th>
                                <th>密碼</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 新增使用者 Modal -->
        <div class="modal fade" id="addUserModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h6 class="modal-title fw-bold">新增使用者</h6><button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-2"><label class="form-label">帳號 <span class="text-danger">*</span></label><input
                                class="form-control" id="nuUser"></div>
                        <div class="mb-2"><label class="form-label">密碼 <span class="text-danger">*</span></label><input
                                class="form-control" id="nuPass"></div>
                        <div class="mb-2"><label class="form-label">姓名</label><input class="form-control" id="nuName">
                        </div>
                        <div class="mb-2"><label class="form-label">角色</label>
                            <select class="form-select" id="nuRole">
                                <option value="user">一般使用者</option>
                                <option value="influencer">網紅</option>
                                <option value="admin">管理員</option>
                            </select>
                        </div>
                        <div class="mb-2"><label class="form-label">部門</label><input class="form-control" id="nuDept">
                        </div>
                        <div id="nuError" class="text-danger mt-2" style="font-size:0.85rem"></div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-primary" id="btnSaveUser">儲存</button></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script>
        /* ===== 許可權 ===== */
        const user = JSON.parse(sessionStorage.getItem('user') || 'null');
        if (!user || user.role !== 'admin') { alert('需要管理者許可權'); window.location.href = 'login.html'; }
        document.getElementById('adminName').textContent = user.name || user.username;
        document.getElementById('btnLogout').onclick = () => { sessionStorage.removeItem('user'); window.location.href = 'login.html'; };

        /* ===== 查詢 ===== */
        let allRecords = [];
        document.getElementById('btnSearch').onclick = loadRecords;

        async function loadRecords() {
            let query = db.from('records').select('*').order('created_at', { ascending: false });
            const name = document.getElementById('fName').value.trim();
            const ref = document.getElementById('fRef').value.trim();
            const from = document.getElementById('fFrom').value;
            const to = document.getElementById('fTo').value;
            if (name) query = query.ilike('taker_name', `%${name}%`);
            if (ref) query = query.eq('referral_code', ref);
            if (from) query = query.gte('created_at', from);
            if (to) query = query.lte('created_at', to + 'T23:59:59');

            const { data, error } = await query;
            if (error) { alert('查詢失敗：' + error.message); return; }
            allRecords = data || [];
            renderTable(allRecords);
            updateStats(allRecords);
        }

        function renderTable(rows) {
            const thead = document.querySelector('#tbl thead tr');
            const tbody = document.querySelector('#tbl tbody');
            thead.innerHTML = ''; tbody.innerHTML = '';
            if (!rows.length) { thead.innerHTML = '<th class="text-center text-muted">暫無資料</th>'; document.getElementById('meta').textContent = ''; return; }

            thead.innerHTML = '<th>時間</th><th>姓名</th><th>電話</th><th>組織</th><th>部門</th><th>推薦碼</th><th>D</th><th>I</th><th>S</th><th>C</th><th>主型</th><th>圖表</th>';
            rows.forEach((r, i) => {
                const d = new Date(r.created_at);
                const colors = { D: 'var(--d-color)', I: 'var(--i-color)', S: 'var(--s-color)', C: 'var(--c-color)' };
                const tr = document.createElement('tr');
                tr.innerHTML = `
      <td class="text-nowrap">${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}</td>
      <td>${r.taker_name || ''}</td><td>${r.taker_phone || ''}</td><td>${r.org || ''}</td><td>${r.dept || ''}</td>
      <td><code>${r.referral_code || '—'}</code></td>
      <td><strong style="color:${colors.D}">${r.d_score}</strong></td>
      <td><strong style="color:${colors.I}">${r.i_score}</strong></td>
      <td><strong style="color:${colors.S}">${r.s_score}</strong></td>
      <td><strong style="color:${colors.C}">${r.c_score}</strong></td>
      <td><span class="badge" style="background:${colors[r.primary_type] || '#999'};color:#fff">${r.primary_type || '?'}</span></td>
      <td></td>`;
                const canvas = document.createElement('canvas'); canvas.className = 'mini-chart';
                tr.lastElementChild.appendChild(canvas);
                tbody.appendChild(tr);
                new Chart(canvas.getContext('2d'), { type: 'bar', data: { labels: ['D', 'I', 'S', 'C'], datasets: [{ data: [r.d_score, r.i_score, r.s_score, r.c_score], backgroundColor: ['#e74c3c', '#f39c12', '#27ae60', '#2980b9'], borderRadius: 3 }] }, options: { responsive: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } } } });
            });
            document.getElementById('meta').textContent = `共 ${rows.length} 筆`;
        }

        function updateStats(rows) {
            document.getElementById('statTotal').textContent = rows.length;
            let d = 0, i = 0, s = 0, c = 0;
            rows.forEach(r => { if (r.primary_type === 'D') d++; else if (r.primary_type === 'I') i++; else if (r.primary_type === 'S') s++; else c++; });
            document.getElementById('statD').textContent = d;
            document.getElementById('statI').textContent = i;
            document.getElementById('statS').textContent = s;
            renderPie([d, i, s, c]);
        }

        let pieInst = null;
        function renderPie(data) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if (pieInst) pieInst.destroy();
            pieInst = new Chart(ctx, { type: 'doughnut', data: { labels: ['D 支配型', 'I 影響型', 'S 穩健型', 'C 分析型'], datasets: [{ data, backgroundColor: ['#e74c3c', '#f39c12', '#27ae60', '#2980b9'], borderWidth: 3, borderColor: '#fff' }] }, options: { responsive: true, cutout: '55%', plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, font: { size: 12 } } } } } });
        }

        /* ===== CSV ===== */
        document.getElementById('btnExport').onclick = () => {
            const rows = [...document.querySelectorAll('#tbl tr')].map(tr => [...tr.children].map(td => `"${String(td.textContent).replace(/"/g, '""')}"`).join(','));
            const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `disc_records_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
        };

        /* ===== 使用者管理 ===== */
        const tblBody = document.querySelector('#tblUsers tbody');
        document.getElementById('btnLoadUsers').onclick = loadUsers;

        async function loadUsers() {
            const { data, error } = await db.from('users').select('*').order('created_at', { ascending: false });
            if (error) { alert('載入失敗'); return; }
            renderUsers(data || []);
        }

        function renderUsers(rows) {
            tblBody.innerHTML = '';
            rows.forEach(u => {
                const tr = document.createElement('tr');
                const roleMap = { admin: '管理員', influencer: '網紅', user: '使用者' };
                const roleClass = u.role === 'admin' ? 'badge-admin' : u.role === 'influencer' ? 'bg-warning text-dark' : 'badge-user';
                tr.innerHTML = `
      <td class="fw-medium">${u.username}</td>
      <td>${u.name || '—'}</td>
      <td><span class="badge ${roleClass}">${roleMap[u.role] || u.role}</span></td>
      <td><code>${u.referral_code || '—'}</code></td>
      <td>${u.is_active ? '<span class="text-success">✓ 啟用</span>' : '<span class="text-danger">✗ 停用</span>'}</td>
      <td>${u.role !== 'admin' ? `<input type="text" class="form-control form-control-sm user-pw-input" value="${u.password || ''}">` :
                        '<span class="text-muted">—</span>'}</td>
      <td class="text-nowrap">${u.role !== 'admin' ? `<button class="btn btn-sm btn-primary btn-save me-1" title="儲存密碼"><i class="bi bi-check-lg"></i></button>
        <button class="btn btn-sm ${u.is_active ? 'btn-outline-danger' : 'btn-outline-success'} btn-toggle" title="${u.is_active ? '停用' : '啟用'}">
        <i class="bi bi-${u.is_active ? 'x-circle' : 'check-circle'}"></i></button>` : ''}</td>`;

                if (u.role !== 'admin') {
                    // 儲存密碼
                    const btnSave = tr.querySelector('.btn-save');
                    const inp = tr.querySelector('input');
                    if (btnSave) btnSave.onclick = async () => {
                        const pw = inp.value.trim(); if (!pw) { alert('密碼不可空'); return; }
                        btnSave.disabled = true;
                        const { error } = await db.from('users').update({ password: pw }).eq('id', u.id);
                        if (!error) { btnSave.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i>'; setTimeout(() => btnSave.innerHTML = '<i class="bi bi-check-lg"></i>', 1500); }
                        else alert('更新失敗');
                        btnSave.disabled = false;
                    };
                    // 啟用/停用
                    const btnToggle = tr.querySelector('.btn-toggle');
                    if (btnToggle) btnToggle.onclick = async () => {
                        const { error } = await db.from('users').update({ is_active: !u.is_active }).eq('id', u.id);
                        if (!error) loadUsers(); else alert('操作失敗');
                    };
                }
                tblBody.appendChild(tr);
            });
        }

        /* ===== 新增使用者 ===== */
        const addModal = new bootstrap.Modal(document.getElementById('addUserModal'));
        document.getElementById('btnAddUser').onclick = () => addModal.show();
        document.getElementById('btnSaveUser').onclick = async () => {
            const username = document.getElementById('nuUser').value.trim();
            const password = document.getElementById('nuPass').value.trim();
            const name = document.getElementById('nuName').value.trim();
            const role = document.getElementById('nuRole').value;
            const dept = document.getElementById('nuDept').value.trim();
            if (!username || !password) { document.getElementById('nuError').textContent = '帳號和密碼必填'; return; }

            // 網紅自動生成推薦碼
            const referral_code = role === 'influencer' ? username.toLowerCase().replace(/[^a-z0-9]/g, '') + '_' + Math.random().toString(36).slice(2, 8) : null;

            const { error } = await db.from('users').insert({ username, password, name, role, dept, referral_code });
            if (error) { document.getElementById('nuError').textContent = '建立失敗：' + error.message; return; }
            addModal.hide();
            document.getElementById('nuUser').value = ''; document.getElementById('nuPass').value = ''; document.getElementById('nuName').value = ''; document.getElementById('nuDept').value = '';
            loadUsers();
        };

        /* ===== 初次載入 ===== */
        loadRecords();
        loadUsers();
    </script>
</body>

</html>
